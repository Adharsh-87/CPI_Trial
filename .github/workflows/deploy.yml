name: Deploy CPI Artifacts

on:
  push:
    branches:
      - CPI-Main
    paths:
      - "TestSample/IntegrationFlow/**"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install zip and jq
        run: sudo apt-get update && sudo apt-get install -y zip jq

      - name: Deploy CPI artifacts
        env:
          CPI_HOST: ${{ secrets.CPI_HOST }}
          CPI_CLIENT_ID: ${{ secrets.CPI_CLIENT_ID }}
          CPI_CLIENT_SECRET: ${{ secrets.CPI_CLIENT_SECRET }}
          CPI_TOKEN_URL: ${{ secrets.CPI_TOKEN_URL }}
        run: |
          chmod +x deploy-iflow.sh
          ./deploy-iflow.sh