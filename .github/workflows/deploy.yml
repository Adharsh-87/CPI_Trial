name: Deploy CPI Full Package

on:
  push:
    branches:
      - CPI-Main

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      # ============================================
      # CHECKOUT REPOSITORY
      # ============================================

      - name: Checkout Repository
        uses: actions/checkout@v4

      # ============================================
      # LOAD CONFIG VARIABLES
      # ============================================

      - name: Load Config Variables
        run: |

          CONFIG_FILE=".github/config/cpi-deploy.env"

          echo "📦 Loading configuration..."

          if [ ! -f "$CONFIG_FILE" ]; then

            echo "❌ Config file missing"

            exit 1

          fi

          while IFS='=' read -r key value; do

            if [[ ! "$key" =~ ^# ]] && [[ -n "$key" ]]; then

              echo "$key=$value" >> $GITHUB_ENV

            fi

          done < "$CONFIG_FILE"

      # ============================================
      # INSTALL REQUIRED TOOLS
      # ============================================

      - name: Install Required Packages
        run: |

          sudo apt-get update

          sudo apt-get install -y zip jq curl unzip

      # ============================================
      # DEPLOY PACKAGE ARTIFACTS
      # ============================================

      - name: Deploy Artifacts to SAP CPI
        env:
          CPI_CLIENT_ID: ${{ secrets.CPI_CLIENT_ID }}
          CPI_CLIENT_SECRET: ${{ secrets.CPI_CLIENT_SECRET }}
        run: |

          set -e

          PACKAGE_ID="${CPI_PACKAGE_ID}"

          echo "🔑 Fetching OAuth token..."

          TOKEN_RESPONSE=$(curl -s -X POST \
            -u "$CPI_CLIENT_ID:$CPI_CLIENT_SECRET" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "grant_type=client_credentials" \
            "$CPI_TOKEN_URL")

          TOKEN=$(echo "$TOKEN_RESPONSE" | jq -r '.access_token')

          if [ "$TOKEN" = "null" ] || [ -z "$TOKEN" ]; then

            echo "❌ Failed to get access token"

            echo "$TOKEN_RESPONSE"

            exit 1

          fi

          echo "✅ OAuth token fetched"

          # ============================================
          # TEST CPI ACCESS
          # ============================================

          echo "🔍 Testing CPI API access..."

          TEST_RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
            "$CPI_HOST/api/v1/IntegrationPackages" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/json")

          TEST_STATUS=$(echo "$TEST_RESPONSE" | grep HTTP_STATUS | cut -d: -f2)

          if [ "$TEST_STATUS" != "200" ]; then

            echo "❌ CPI API access failed"

            echo "$TEST_RESPONSE"

            exit 1

          fi

          echo "✅ CPI API access verified"

          # ============================================
          # FUNCTION TO DEPLOY ANY ARTIFACT TYPE
          # ============================================

          deploy_artifact_type () {

            ARTIFACT_TYPE=$1

            API_ENTITY=$2

            DEPLOY_API=$3

            ROOT_PATH="${PACKAGE_ROOT}/${ARTIFACT_TYPE}"

            if [ ! -d "$ROOT_PATH" ]; then

              echo "⚠️ ${ARTIFACT_TYPE} folder not found"

              return

            fi

            echo "------------------------------------------"

            echo "📦 Processing Artifact Type: ${ARTIFACT_TYPE}"

            for ARTIFACT_DIR in "$ROOT_PATH"/*; do

              [ -d "$ARTIFACT_DIR" ] || continue

              ARTIFACT_ID=$(basename "$ARTIFACT_DIR")

              ZIP_FILE="/tmp/${ARTIFACT_ID}.zip"

              echo "📥 Processing artifact: $ARTIFACT_ID"

              rm -f "$ZIP_FILE"

              echo "🗜️ Creating ZIP package..."

              (
                cd "$ARTIFACT_DIR"

                zip -r "$ZIP_FILE" .
              )

              if [ ! -f "$ZIP_FILE" ]; then

                echo "❌ ZIP creation failed"

                exit 1

              fi

              CONTENT=$(base64 -w 0 "$ZIP_FILE")

              echo "🔍 Checking whether artifact exists in CPI..."

              CHECK_RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
                "$CPI_HOST/api/v1/${API_ENTITY}(Id='$ARTIFACT_ID',Version='active')" \
                -H "Authorization: Bearer $TOKEN" \
                -H "Accept: application/json")

              CHECK_STATUS=$(echo "$CHECK_RESPONSE" | grep HTTP_STATUS | cut -d: -f2)

              # ============================================
              # UPDATE EXISTING ARTIFACT
              # ============================================

              if [ "$CHECK_STATUS" = "200" ]; then

                echo "♻️ Artifact exists. Updating..."

                RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X PUT \
                  "$CPI_HOST/api/v1/${API_ENTITY}(Id='$ARTIFACT_ID',Version='active')" \
                  -H "Authorization: Bearer $TOKEN" \
                  -H "Content-Type: application/json" \
                  -d "{
                    \"Name\": \"$ARTIFACT_ID\",
                    \"PackageId\": \"$PACKAGE_ID\",
                    \"ArtifactContent\": \"$CONTENT\"
                  }")

              # ============================================
              # CREATE NEW ARTIFACT
              # ============================================

              elif [ "$CHECK_STATUS" = "404" ]; then

                echo "🆕 Artifact does not exist. Creating..."

                RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST \
                  "$CPI_HOST/api/v1/${API_ENTITY}" \
                  -H "Authorization: Bearer $TOKEN" \
                  -H "Content-Type: application/json" \
                  -d "{
                    \"Id\": \"$ARTIFACT_ID\",
                    \"Name\": \"$ARTIFACT_ID\",
                    \"PackageId\": \"$PACKAGE_ID\",
                    \"ArtifactContent\": \"$CONTENT\"
                  }")

              else

                echo "❌ Could not verify artifact status"

                echo "$CHECK_RESPONSE"

                exit 1

              fi

              STATUS=$(echo "$RESPONSE" | grep HTTP_STATUS | cut -d: -f2)

              echo "$RESPONSE"

              if [ "$STATUS" != "200" ] && \
                 [ "$STATUS" != "201" ] && \
                 [ "$STATUS" != "202" ]; then

                echo "❌ Artifact create/update failed"

                exit 1

              fi

              # ============================================
              # DEPLOY ARTIFACT
              # ============================================

              echo "🚀 Deploying artifact..."

              DEPLOY_RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST \
                "$CPI_HOST/api/v1/${DEPLOY_API}?Id='$ARTIFACT_ID'&Version='active'" \
                -H "Authorization: Bearer $TOKEN")

              DEPLOY_STATUS=$(echo "$DEPLOY_RESPONSE" | grep HTTP_STATUS | cut -d: -f2)

              echo "$DEPLOY_RESPONSE"

              if [ "$DEPLOY_STATUS" != "200" ] && \
                 [ "$DEPLOY_STATUS" != "202" ]; then

                echo "❌ Deployment failed for $ARTIFACT_ID"

                exit 1

              fi

              echo "✅ Successfully deployed ${ARTIFACT_TYPE}: $ARTIFACT_ID"

            done
          }

          # ============================================
          # DEPLOY ALL CPI ARTIFACT TYPES
          # ============================================

          deploy_artifact_type \
            "IntegrationFlow" \
            "IntegrationDesigntimeArtifacts" \
            "DeployIntegrationDesigntimeArtifact"

          deploy_artifact_type \
            "ScriptCollection" \
            "ScriptCollectionDesigntimeArtifacts" \
            "DeployScriptCollectionDesigntimeArtifact"

          deploy_artifact_type \
            "ValueMapping" \
            "ValueMappingDesigntimeArtifacts" \
            "DeployValueMappingDesigntimeArtifact"

          deploy_artifact_type \
            "MessageMapping" \
            "MessageMappingDesigntimeArtifacts" \
            "DeployMessageMappingDesigntimeArtifact"

          echo "Full package deployment completed successfully"
