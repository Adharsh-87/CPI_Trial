name: Import CPI Package from GitHub

on:
  push:
    branches:
      - CPI-Main

permissions:
  contents: read

jobs:
  import-package:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Load Config Variables
        run: |

          CONFIG_FILE=".github/config/cpi-package.env"

          while IFS='=' read -r key value; do

            if [[ ! "$key" =~ ^# ]] && [[ -n "$key" ]]; then
              echo "$key=$value" >> $GITHUB_ENV
            fi

          done < "$CONFIG_FILE"

      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl

      - name: Import Full Package to CPI
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          AUTH_URL: ${{ secrets.AUTH_URL }}
        run: |

          set -e

          PACKAGE_ZIP="packages/${PACKAGE_ID}.zip"

          if [ ! -f "$PACKAGE_ZIP" ]; then
            echo "❌ Package ZIP not found"
            exit 1
          fi

          echo "🔑 Fetching OAuth token..."

          TOKEN_RESPONSE=$(curl -s -X POST "$AUTH_URL" \
            -u "$CLIENT_ID:$CLIENT_SECRET" \
            -d "grant_type=client_credentials&response_type=token")

          ACCESS_TOKEN=$(echo "$TOKEN_RESPONSE" | jq -r '.access_token')

          if [ -z "$ACCESS_TOKEN" ] || [ "$ACCESS_TOKEN" == "null" ]; then
            echo "❌ Failed to fetch token"
            exit 1
          fi

          echo "📦 Importing package into CPI..."

          HTTP_STATUS=$(curl -s \
            -o response.txt \
            -w "%{http_code}" \
            -X POST \
            "${CPI_TMN_HOST}/api/v1/IntegrationPackages" \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @"$PACKAGE_ZIP")

          cat response.txt

          if [ "$HTTP_STATUS" != "200" ] && \
             [ "$HTTP_STATUS" != "201" ] && \
             [ "$HTTP_STATUS" != "202" ]; then

            echo "❌ Package import failed"

            exit 1

          fi

          echo "✅ Full package imported successfully"

