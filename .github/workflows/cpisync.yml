name: Sync SAP CPI Artifacts to Git

on:
  workflow_dispatch:
    inputs:

      PACKAGE_ID:
        description: "SAP CPI Package ID"
        required: true
        type: string

      SYNC_MODE:
        description: "Sync Mode"
        required: true
        default: "ALL"
        type: choice
        options:
          - ALL
          - SINGLE

      ARTIFACT_ID:
        description: "Artifact ID (Required for SINGLE mode)"
        required: false
        type: string

      VERSION_TYPE:
        description: "Artifact Version"
        required: true
        default: "draft"
        type: choice
        options:
          - draft
          - active

      BRANCH_NAME:
        description: "Target Git Branch"
        required: true
        default: "CPI-Main"
        type: string


permissions:
  contents: write

jobs:

  sync-cpi-artifacts:
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # CHECKOUT REPOSITORY
      # =========================================================

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 0
          ref: ${{ github.event.inputs.BRANCH_NAME }}

      # =========================================================
      # INSTALL REQUIRED PACKAGES
      # =========================================================

      - name: Install Required Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y jq unzip

      # =========================================================
      # FETCH OAUTH TOKEN
      # =========================================================

      - name: Fetch OAuth Token
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          AUTH_URL: ${{ secrets.AUTH_URL }}

        run: |

          set -e

          echo "Fetching OAuth token..."

          TOKEN_RESPONSE=$(curl -s -X POST "$AUTH_URL" \
            -u "$CLIENT_ID:$CLIENT_SECRET" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "grant_type=client_credentials")

          ACCESS_TOKEN=$(echo "$TOKEN_RESPONSE" | jq -r '.access_token')

          if [ -z "$ACCESS_TOKEN" ] || [ "$ACCESS_TOKEN" == "null" ]; then
            echo "Failed to fetch token"
            echo "$TOKEN_RESPONSE"
            exit 1
          fi

          echo "ACCESS_TOKEN=$ACCESS_TOKEN" >> $GITHUB_ENV

      # =========================================================
      # FETCH CPI ARTIFACTS
      # =========================================================

      - name: Fetch CPI Artifacts

        env:
          CPI_TMN_HOST: ${{ secrets.CPI_TMN_HOST || secrets.CPI_HOST }}

        run: |

          set -e

          PACKAGE_ID="${{ github.event.inputs.PACKAGE_ID }}"
          SYNC_MODE="${{ github.event.inputs.SYNC_MODE }}"
          ARTIFACT_ID="${{ github.event.inputs.ARTIFACT_ID }}"
          VERSION_TYPE="${{ github.event.inputs.VERSION_TYPE }}"

          ROOT_DIR="${{ github.workspace }}/$PACKAGE_ID"

          TMP_DIR="/tmp/cpi_sync_$(date +%s)"

          mkdir -p "$TMP_DIR"

          echo "Package ID: $PACKAGE_ID"
          echo "Using CPI host: $CPI_TMN_HOST"

          API_URL="${CPI_TMN_HOST}/api/v1/IntegrationPackages('${PACKAGE_ID}')/IntegrationDesigntimeArtifacts"

          echo "Fetching package artifacts..."

          ARTIFACTS_RESPONSE=$(curl -sSL -w "\nHTTP_STATUS:%{http_code}\nCONTENT_TYPE:%{content_type}" -X GET "$API_URL" \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "Accept: application/json")

          ARTIFACTS_HTTP_STATUS=$(echo "$ARTIFACTS_RESPONSE" | tail -n1 | sed 's/HTTP_STATUS://')
          ARTIFACTS_CONTENT_TYPE=$(echo "$ARTIFACTS_RESPONSE" | tail -n2 | head -n1 | sed 's/CONTENT_TYPE://')
          ARTIFACTS_JSON=$(echo "$ARTIFACTS_RESPONSE" | sed '$d' | sed '$d')

          echo "Artifact fetch HTTP status: $ARTIFACTS_HTTP_STATUS"
          echo "Artifact fetch Content-Type: $ARTIFACTS_CONTENT_TYPE"

          if [ "$ARTIFACTS_HTTP_STATUS" != "200" ]; then
            echo "❌ Failed to fetch package artifacts"
            echo "$ARTIFACTS_JSON"
            exit 1
          fi

          if [[ "$ARTIFACTS_CONTENT_TYPE" == text/html* ]]; then
            echo "❌ CPI host returned HTML content instead of JSON. This usually means the host is wrong or the token is not valid for the API endpoint."
            echo "CPI host: $CPI_TMN_HOST"
            echo "API URL: $API_URL"
            echo "$ARTIFACTS_JSON"
            exit 1
          fi

          if ! echo "$ARTIFACTS_JSON" | jq -e . >/dev/null 2>&1; then
            echo "❌ Invalid JSON from CPI package artifacts API"
            echo "$ARTIFACTS_JSON"
            exit 1
          fi

          if [ "$SYNC_MODE" == "SINGLE" ]; then

            if [ -z "$ARTIFACT_ID" ]; then
              echo "ARTIFACT_ID is mandatory in SINGLE mode"
              exit 1
            fi

            ARTIFACT_LIST="$ARTIFACT_ID"

          else

            ARTIFACT_LIST=$(echo "$ARTIFACTS_JSON" | jq -r '.d.results[].Id')

          fi

          if [ -z "$ARTIFACT_LIST" ]; then
            echo "❌ No artifacts found for package $PACKAGE_ID"
            exit 1
          fi

          # =====================================================
          # CLEAN PACKAGE ONLY FOR FULL SYNC
          # =====================================================

          if [ "$SYNC_MODE" == "ALL" ]; then

            echo "Cleaning package folder..."

            rm -rf "$ROOT_DIR"

          fi

          mkdir -p "$ROOT_DIR"

          # =====================================================
          # PROCESS ARTIFACTS
          # =====================================================

          for CURRENT_ARTIFACT in $ARTIFACT_LIST; do

            echo "========================================"

            echo "Processing: $CURRENT_ARTIFACT"

            ARTIFACT_TYPE=$(echo "$ARTIFACTS_JSON" | jq -r \
              ".d.results[] | select(.Id==\"$CURRENT_ARTIFACT\") | .ArtifactType")

            if [ -z "$ARTIFACT_TYPE" ] || [ "$ARTIFACT_TYPE" == "null" ]; then
              ARTIFACT_TYPE="UNKNOWN"
            fi

            echo "Artifact Type: $ARTIFACT_TYPE"

            case "$ARTIFACT_TYPE" in

              "INTEGRATION_FLOW")
                TARGET_BASE="$ROOT_DIR/IntegrationFlow"
                ;;

              "API")
                TARGET_BASE="$ROOT_DIR/API"
                ;;

              "SCRIPT_COLLECTION")
                TARGET_BASE="$ROOT_DIR/ScriptCollection"
                ;;

              "VALUE_MAPPING")
                TARGET_BASE="$ROOT_DIR/ValueMapping"
                ;;

              "MESSAGE_MAPPING")
                TARGET_BASE="$ROOT_DIR/MessageMapping"
                ;;

              *)
                TARGET_BASE="$ROOT_DIR/Others"
                ;;

            esac

            mkdir -p "$TARGET_BASE"

            ARTIFACT_DIR="$TARGET_BASE/$CURRENT_ARTIFACT"

            rm -rf "$ARTIFACT_DIR"

            mkdir -p "$ARTIFACT_DIR"

            DOWNLOAD_URL="${CPI_TMN_HOST}/api/v1/IntegrationDesigntimeArtifacts(Id='$CURRENT_ARTIFACT',Version='$VERSION_TYPE')/\$value"

            ZIP_FILE="$TMP_DIR/$CURRENT_ARTIFACT.zip"

            HTTP_STATUS=$(curl -s \
              -o "$ZIP_FILE" \
              -w "%{http_code}" \
              -X GET "$DOWNLOAD_URL" \
              -H "Authorization: Bearer $ACCESS_TOKEN")

            # =====================================================
            # FALLBACK TO ACTIVE
            # =====================================================

            if [ "$HTTP_STATUS" -ne 200 ] && [ "$VERSION_TYPE" == "draft" ]; then

              echo "Draft not found. Trying active..."

              DOWNLOAD_URL="${CPI_TMN_HOST}/api/v1/IntegrationDesigntimeArtifacts(Id='$CURRENT_ARTIFACT',Version='active')/\$value"

              HTTP_STATUS=$(curl -s \
                -o "$ZIP_FILE" \
                -w "%{http_code}" \
                -X GET "$DOWNLOAD_URL" \
                -H "Authorization: Bearer $ACCESS_TOKEN")

            fi

            if [ "$HTTP_STATUS" -ne 200 ]; then

              echo "Failed to download artifact"

              rm -rf "$ARTIFACT_DIR"

              continue

            fi

            if [ ! -f "$ZIP_FILE" ] || [ ! -s "$ZIP_FILE" ]; then

              echo "Invalid ZIP file"

              rm -rf "$ARTIFACT_DIR"

              continue

            fi

            unzip -q -o "$ZIP_FILE" \
              -d "$ARTIFACT_DIR"

            echo "Synced: $CURRENT_ARTIFACT"

          done

          rm -rf "$TMP_DIR"

      # =========================================================
      # COMMIT AND PUSH
      # =========================================================

      - name: Commit and Push Changes

        run: |

          set -e

          PACKAGE_ID="${{ github.event.inputs.PACKAGE_ID }}"
          BRANCH_NAME="${{ github.event.inputs.BRANCH_NAME }}"

          git config --global user.name "github-actions[bot]"

          git config --global user.email \
            "github-actions[bot]@users.noreply.github.com"

          git status

          git add "$PACKAGE_ID/"

          if [[ -n $(git status --porcelain) ]]; then

            git commit -m \
              "SAP CPI Sync | Package=${PACKAGE_ID} | Build=${GITHUB_RUN_NUMBER}"

            git push origin "$BRANCH_NAME"

          else

            echo "No changes detected"

          fi

