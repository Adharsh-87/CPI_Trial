name: Sync SAP CPI Artifacts to Git

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-artifacts:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Load Config Variables
        run: |

          CONFIG_FILE=".github/config/cpi-config.env"

          echo "📦 Loading configuration from $CONFIG_FILE"

          if [ ! -f "$CONFIG_FILE" ]; then
            echo "❌ Config file not found"
            exit 1
          fi

          while IFS='=' read -r key value; do

            # Ignore comments and empty lines
            if [[ ! "$key" =~ ^# ]] && [[ -n "$key" ]]; then
              echo "$key=$value" >> $GITHUB_ENV
            fi

          done < "$CONFIG_FILE"

      - name: Checkout Target Branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH_NAME }}

      - name: Install Required Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y jq unzip

      - name: Fetch and Process CPI Artifacts
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          AUTH_URL: ${{ secrets.AUTH_URL }}
        run: |
          set -e

          TMP_DIR="/tmp/cpi_sync_$(date +%s)"
          mkdir -p "$TMP_DIR"

          echo "🔑 Fetching OAuth token from SAP CPI..."

          TOKEN_RESPONSE=$(curl -s -X POST "$AUTH_URL" \
            -u "$CLIENT_ID:$CLIENT_SECRET" \
            -d "grant_type=client_credentials&response_type=token")

          ACCESS_TOKEN=$(echo "$TOKEN_RESPONSE" | jq -r '.access_token')

          if [ -z "$ACCESS_TOKEN" ] || [ "$ACCESS_TOKEN" == "null" ]; then
            echo "❌ Error: Failed to fetch access token. Response: $TOKEN_RESPONSE"
            exit 1
          fi

          echo "📦 Fetching live artifacts list for package: ${PACKAGE_ID}..."

          API_URL="${CPI_TMN_HOST}/api/v1/IntegrationPackages('${PACKAGE_ID}')/IntegrationDesigntimeArtifacts"

          ARTIFACTS_JSON=$(curl -s -X GET "$API_URL" \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "Accept: application/json" \
            -H "Cache-Control: no-cache")

          ARTIFACT_IDS=$(echo "$ARTIFACTS_JSON" | jq -r '.d.results[].Id')

          TARGET_DIR="${GITHUB_WORKSPACE}/${PACKAGE_ID}/IntegrationFlow"

          # CRITICAL FOR DELETIONS
          if [ -d "$TARGET_DIR" ]; then
            echo "🧹 Clearing local workspace folder..."
            rm -rf "$TARGET_DIR"
          fi

          mkdir -p "$TARGET_DIR"

          if [ -z "$ARTIFACT_IDS" ] || [ "$ARTIFACT_IDS" == "null" ]; then

            echo "⚠️ No artifacts currently exist in CPI package ${PACKAGE_ID}."

          else

            for ARTIFACT_ID in $ARTIFACT_IDS; do

              echo "📥 Processing artifact: $ARTIFACT_ID..."

              # Step A: Try DRAFT version first
              DOWNLOAD_URL="${CPI_TMN_HOST}/api/v1/IntegrationDesigntimeArtifacts(Id='$ARTIFACT_ID',Version='draft')/\$value"

              HTTP_STATUS=$(curl -s \
                -o "$TMP_DIR/$ARTIFACT_ID.zip" \
                -w "%{http_code}" \
                -X GET "$DOWNLOAD_URL" \
                -H "Authorization: Bearer $ACCESS_TOKEN" \
                -H "Cache-Control: no-cache")

              # Step B: Fallback to ACTIVE
              if [ "$HTTP_STATUS" -ne 200 ]; then

                echo "ℹ️ No draft found for $ARTIFACT_ID. Fetching active version instead..."

                DOWNLOAD_URL="${CPI_TMN_HOST}/api/v1/IntegrationDesigntimeArtifacts(Id='$ARTIFACT_ID',Version='active')/\$value"

                HTTP_STATUS=$(curl -s \
                  -o "$TMP_DIR/$ARTIFACT_ID.zip" \
                  -w "%{http_code}" \
                  -X GET "$DOWNLOAD_URL" \
                  -H "Authorization: Bearer $ACCESS_TOKEN" \
                  -H "Cache-Control: no-cache")
              fi

              ARTIFACT_GIT_DIR="$TARGET_DIR/$ARTIFACT_ID"

              # Remove old content completely
              rm -rf "$ARTIFACT_GIT_DIR"

              mkdir -p "$ARTIFACT_GIT_DIR"

              if [ "$HTTP_STATUS" -ne 200 ]; then

                echo "❌ Failed to fetch payload bundle for $ARTIFACT_ID"

                rm -rf "$ARTIFACT_GIT_DIR"

                continue
              fi

              if [ -f "$TMP_DIR/$ARTIFACT_ID.zip" ] && [ -s "$TMP_DIR/$ARTIFACT_ID.zip" ]; then

                unzip -q -o "$TMP_DIR/$ARTIFACT_ID.zip" -d "$ARTIFACT_GIT_DIR"

                echo "✅ Successfully synced $ARTIFACT_ID"

              else

                echo "❌ ZIP file invalid for $ARTIFACT_ID"

                rm -rf "$ARTIFACT_GIT_DIR"
              fi

            done
          fi

          rm -rf "$TMP_DIR"

      - name: Commit and Push Changes
        run: |

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git status

          git add -A "${PACKAGE_ID}/"

          if [[ -n $(git status --porcelain) ]]; then

            git commit -m "Auto-sync CPI Package: ${PACKAGE_ID} Lifecycle Sync (Build ${GITHUB_RUN_NUMBER})"

            echo "📤 Pushing updates to GitHub..."

            git push origin ${BRANCH_NAME}

          else

            echo "ℹ️ Workspace matches CPI perfectly. No changes to commit."

          fi

