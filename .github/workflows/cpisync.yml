name: Export CPI Package to GitHub

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export-package:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Load Config Variables
        run: |

          CONFIG_FILE=".github/config/cpi-package.env"

          while IFS='=' read -r key value; do

            if [[ ! "$key" =~ ^# ]] && [[ -n "$key" ]]; then
              echo "$key=$value" >> $GITHUB_ENV
            fi

          done < "$CONFIG_FILE"

      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq unzip curl

      - name: Export Full CPI Package
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          AUTH_URL: ${{ secrets.AUTH_URL }}
        run: |

          set -e

          mkdir -p packages

          echo "🔑 Fetching OAuth token..."

          TOKEN_RESPONSE=$(curl -s -X POST "$AUTH_URL" \
            -u "$CLIENT_ID:$CLIENT_SECRET" \
            -d "grant_type=client_credentials&response_type=token")

          ACCESS_TOKEN=$(echo "$TOKEN_RESPONSE" | jq -r '.access_token')

          if [ -z "$ACCESS_TOKEN" ] || [ "$ACCESS_TOKEN" == "null" ]; then
            echo "❌ Failed to fetch token"
            exit 1
          fi

          echo "📦 Exporting full package..."

          DOWNLOAD_URL="${CPI_TMN_HOST}/api/v1/IntegrationPackages('${PACKAGE_ID}')/\$value"

          HTTP_STATUS=$(curl -s \
            -o "packages/${PACKAGE_ID}.zip" \
            -w "%{http_code}" \
            -X GET "$DOWNLOAD_URL" \
            -H "Authorization: Bearer $ACCESS_TOKEN")

          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "❌ Package export failed"
            exit 1
          fi

          echo "✅ Package exported successfully"

      - name: Commit and Push Package
        run: |

          git config --global user.name "github-actions[bot]"

          git config --global user.email \
            "github-actions[bot]@users.noreply.github.com"

          git add packages/

          if [[ -n $(git status --porcelain) ]]; then

            git commit -m \
              "Export CPI Package: ${PACKAGE_ID}"

            git push origin ${BRANCH_NAME}

          else

            echo "ℹ️ No package changes detected"

          fi
