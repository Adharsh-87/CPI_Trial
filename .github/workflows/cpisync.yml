name: Sync SAP CPI Artifacts to Git

on:
  workflow_dispatch:
    inputs:

      PACKAGE_ID:
        description: "SAP CPI Package ID"
        required: true
        type: string

      ARTIFACT_TYPE:
        description: "ARTIFACT_TYPE:(Select 'All' to sync all artifacts)"
        required: true
        default: "Integration Flow"
        type: choice
        options:
          - Integration Flow
          - Value Mapping
          - Message Mapping
          - Script Collection
          - All

      SYNC_MODE:
        description: "SYNC_MODE:(Required only when ARTIFACT_TYPE is not 'All')"
        required: false
        default: "ALL"
        type: choice
        options:
          - ALL
          - SINGLE

      ARTIFACT_ID:
        description: "ARTIFACT_ID:(Required only when SYNC_MODE=SINGLE)"
        required: false
        type: string

      BRANCH_NAME:
        description: "BRANCH_NAME:(Target Git Branch)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  sync-artifacts:
    runs-on: ubuntu-latest

    steps:

      # ============================================
      # CHECKOUT REPOSITORY
      # ============================================

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================
      # LOAD CONFIG VARIABLES
      # ============================================

      - name: Load Config Variables
        run: |

          CONFIG_FILE=".github/config/cpi-config.env"

          echo "📦 Loading configuration from $CONFIG_FILE"

          if [ ! -f "$CONFIG_FILE" ]; then
            echo "❌ Config file not found"
            exit 1
          fi

          while IFS='=' read -r key value; do
            if [[ ! "$key" =~ ^# ]] && [[ -n "$key" ]]; then
              echo "$key=$value" >> $GITHUB_ENV
            fi
          done < "$CONFIG_FILE"

      # ============================================
      # INSTALL REQUIRED PACKAGES
      # ============================================

      - name: Install Required Packages
        run: |

          sudo apt-get update
          sudo apt-get install -y jq unzip

      # ============================================
      # FETCH AND PROCESS CPI ARTIFACTS
      # ============================================

      - name: Fetch and Process CPI Artifacts

        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          AUTH_URL: ${{ secrets.AUTH_URL }}

        run: |

          set -e

          PACKAGE_ID="${{ github.event.inputs.PACKAGE_ID }}"
          ARTIFACT_TYPE="${{ github.event.inputs.ARTIFACT_TYPE }}"
          SYNC_MODE="${{ github.event.inputs.SYNC_MODE }}"
          ARTIFACT_ID_INPUT="${{ github.event.inputs.ARTIFACT_ID }}"
          BRANCH_NAME="${{ github.event.inputs.BRANCH_NAME }}"

          # ============================================
          # HANDLE INPUT COMBINATIONS
          # ============================================

          # CASE 1
          # ARTIFACT_TYPE = All
          # Ignore sync mode and artifact id

          if [ "$ARTIFACT_TYPE" = "All" ]; then

            echo "ℹ️ ARTIFACT_TYPE=All detected"

            SYNC_MODE="ALL"
            ARTIFACT_ID_INPUT=""

          fi

          # CASE 2
          # SYNC_MODE = ALL
          # Ignore artifact id

          if [ "$SYNC_MODE" = "ALL" ]; then

            ARTIFACT_ID_INPUT=""

          fi

          # CASE 3
          # SINGLE mode requires artifact id

          if [ "$SYNC_MODE" = "SINGLE" ] && \
             [ -z "$ARTIFACT_ID_INPUT" ]; then

            echo "❌ ARTIFACT_ID is required for SINGLE mode"

            exit 1

          fi

          echo "--------------------------------------------"
          echo "PACKAGE_ID     = $PACKAGE_ID"
          echo "ARTIFACT_TYPE  = $ARTIFACT_TYPE"
          echo "SYNC_MODE      = $SYNC_MODE"
          echo "ARTIFACT_ID    = $ARTIFACT_ID_INPUT"
          echo "BRANCH_NAME    = $BRANCH_NAME"
          echo "--------------------------------------------"

          # ============================================
          # VALIDATE TARGET BRANCH
          # ============================================

          echo "🔍 Validating target branch: ${BRANCH_NAME}"

          if git ls-remote --exit-code --heads origin "${BRANCH_NAME}" > /dev/null; then

            echo "✅ Branch exists: ${BRANCH_NAME}"

          else

            echo "❌ Target branch not found: ${BRANCH_NAME}"

            exit 1

          fi

          # ============================================
          # CHECKOUT TARGET BRANCH
          # ============================================

          git checkout "${BRANCH_NAME}"

          # ============================================
          # CREATE TEMP DIRECTORY
          # ============================================

          TMP_DIR="/tmp/cpi_sync_$(date +%s)"
          mkdir -p "$TMP_DIR"

          # ============================================
          # FETCH OAUTH TOKEN
          # ============================================

          echo "🔑 Fetching OAuth token from SAP CPI..."

          TOKEN_RESPONSE=$(curl -s -X POST "$AUTH_URL" \
            -u "$CLIENT_ID:$CLIENT_SECRET" \
            -d "grant_type=client_credentials&response_type=token")

          ACCESS_TOKEN=$(echo "$TOKEN_RESPONSE" | jq -r '.access_token')

          if [ -z "$ACCESS_TOKEN" ] || \
             [ "$ACCESS_TOKEN" == "null" ]; then

            echo "❌ Failed to fetch access token"

            echo "$TOKEN_RESPONSE"

            exit 1

          fi

          echo "✅ OAuth token fetched successfully"

          # ============================================
          # URL ENCODE PACKAGE ID
          # ============================================

          ENCODED_PACKAGE_ID=$(printf '%s' "$PACKAGE_ID" | sed 's/ /%20/g')

          PACKAGE_ROOT="${{ github.workspace }}/${PACKAGE_ID}"

          mkdir -p "$PACKAGE_ROOT"

          # ============================================
          # FUNCTION TO PROCESS ARTIFACT TYPES
          # ============================================

          process_artifact_type () {

            ARTIFACT_FOLDER=$1
            API_ENTITY=$2

            echo "📦 Processing Artifact Type: $ARTIFACT_FOLDER"

            API_URL="${CPI_TMN_HOST}/api/v1/IntegrationPackages('${ENCODED_PACKAGE_ID}')/${API_ENTITY}"

            ARTIFACTS_JSON=$(curl -s -X GET "$API_URL" \
              -H "Authorization: Bearer $ACCESS_TOKEN" \
              -H "Accept: application/json")

            TARGET_DIR="${PACKAGE_ROOT}/${ARTIFACT_FOLDER}"

            mkdir -p "$TARGET_DIR"

            ARTIFACT_IDS=$(echo "$ARTIFACTS_JSON" | jq -r '.d.results[]?.Id')

            for ARTIFACT_ID in $ARTIFACT_IDS; do

              # ============================================
              # SINGLE MODE FILTER
              # ============================================

              if [ "$SYNC_MODE" = "SINGLE" ] && \
                 [ "$ARTIFACT_ID" != "$ARTIFACT_ID_INPUT" ]; then

                continue

              fi

              echo "📥 Processing Artifact: $ARTIFACT_ID"

              # ============================================
              # DOWNLOAD ARTIFACT
              # ============================================

              DOWNLOAD_URL="${CPI_TMN_HOST}/api/v1/${API_ENTITY}('${ARTIFACT_ID}','active')/\$value"

              ZIP_FILE="${TMP_DIR}/${ARTIFACT_ID}.zip"

              curl -L -s \
                -H "Authorization: Bearer $ACCESS_TOKEN" \
                -o "$ZIP_FILE" \
                "$DOWNLOAD_URL"

              if [ ! -f "$ZIP_FILE" ]; then

                echo "❌ Failed to download: $ARTIFACT_ID"

                continue

              fi

              ARTIFACT_DIR="${TARGET_DIR}/${ARTIFACT_ID}"

              rm -rf "$ARTIFACT_DIR"

              mkdir -p "$ARTIFACT_DIR"

              unzip -oq "$ZIP_FILE" -d "$ARTIFACT_DIR"

              echo "✅ Extracted: $ARTIFACT_ID"

            done
          }

          # ============================================
          # PROCESS SELECTED ARTIFACT TYPE
          # ============================================

          if [ "$ARTIFACT_TYPE" = "Integration Flow" ]; then

            process_artifact_type \
              "IntegrationFlow" \
              "IntegrationDesigntimeArtifacts"

          elif [ "$ARTIFACT_TYPE" = "Script Collection" ]; then

            process_artifact_type \
              "ScriptCollection" \
              "ScriptCollectionDesigntimeArtifacts"

          elif [ "$ARTIFACT_TYPE" = "Value Mapping" ]; then

            process_artifact_type \
              "ValueMapping" \
              "ValueMappingDesigntimeArtifacts"

          elif [ "$ARTIFACT_TYPE" = "Message Mapping" ]; then

            process_artifact_type \
              "MessageMapping" \
              "MessageMappingDesigntimeArtifacts"

          elif [ "$ARTIFACT_TYPE" = "All" ]; then

            process_artifact_type \
              "IntegrationFlow" \
              "IntegrationDesigntimeArtifacts"

            process_artifact_type \
              "ScriptCollection" \
              "ScriptCollectionDesigntimeArtifacts"

            process_artifact_type \
              "ValueMapping" \
              "ValueMappingDesigntimeArtifacts"

            process_artifact_type \
              "MessageMapping" \
              "MessageMappingDesigntimeArtifacts"

          fi

      # ============================================
      # COMMIT AND PUSH CHANGES
      # ============================================

      - name: Commit and Push Changes
        run: |

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add .

          if git diff --cached --quiet; then

            echo "ℹ️ No changes detected"

          else

            git commit -m "SAP CPI Artifact Sync"

            git push origin "${{ github.event.inputs.BRANCH_NAME }}"

            echo "✅ Changes pushed successfully"

          fi
