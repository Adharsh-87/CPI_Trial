name: Sync SAP CPI Artifacts to Git

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-artifacts:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Load Configuration
        run: |
          echo "📦 Loading external configuration..."

          CONFIG_FILE=".github/config/cpi-config.env"

          if [ ! -f "$CONFIG_FILE" ]; then
            echo "❌ Config file not found: $CONFIG_FILE"
            exit 1
          fi

          cat "$CONFIG_FILE"

          # Export variables into GitHub Actions environment
          while IFS='=' read -r key value; do
            if [[ ! "$key" =~ ^# ]] && [[ -n "$key" ]]; then
              echo "$key=$value" >> $GITHUB_ENV
            fi
          done < "$CONFIG_FILE"

      - name: Checkout Target Branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH_NAME }}

      - name: Install Required Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y jq unzip

      - name: Fetch and Process CPI Artifacts
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          AUTH_URL: ${{ secrets.AUTH_URL }}
        run: |

          set -e

          TMP_DIR="/tmp/cpi_sync_$(date +%s)"
          mkdir -p "$TMP_DIR"

          echo "🔑 Fetching OAuth token..."

          TOKEN_RESPONSE=$(curl -s -X POST "$AUTH_URL" \
            -u "$CLIENT_ID:$CLIENT_SECRET" \
            -d "grant_type=client_credentials&response_type=token")

          ACCESS_TOKEN=$(echo "$TOKEN_RESPONSE" | jq -r '.access_token')

          if [ -z "$ACCESS_TOKEN" ] || [ "$ACCESS_TOKEN" == "null" ]; then
            echo "❌ Failed to fetch access token"
            echo "$TOKEN_RESPONSE"
            exit 1
          fi

          echo "📦 Fetching CPI artifacts..."

          API_URL="${CPI_TMN_HOST}/api/v1/IntegrationPackages('${PACKAGE_ID}')/IntegrationDesigntimeArtifacts"

          ARTIFACTS_JSON=$(curl -s -X GET "$API_URL" \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "Accept: application/json" \
            -H "Cache-Control: no-cache")

          ARTIFACT_IDS=$(echo "$ARTIFACTS_JSON" | jq -r '.d.results[].Id')

          TARGET_DIR="${GITHUB_WORKSPACE}/${PACKAGE_ID}/IntegrationFlow"

          echo "🧹 Cleaning local workspace..."

          if [ -d "$TARGET_DIR" ]; then
            rm -rf "$TARGET_DIR"
          fi

          mkdir -p "$TARGET_DIR"

          if [ -z "$ARTIFACT_IDS" ] || [ "$ARTIFACT_IDS" == "null" ]; then

            echo "⚠️ No artifacts found"

          else

            for ARTIFACT_ID in $ARTIFACT_IDS; do

              echo "📥 Processing artifact: $ARTIFACT_ID"

              ARTIFACT_GIT_DIR="$TARGET_DIR/$ARTIFACT_ID"

              rm -rf "$ARTIFACT_GIT_DIR"
              mkdir -p "$ARTIFACT_GIT_DIR"

              ZIP_FILE="$TMP_DIR/$ARTIFACT_ID.zip"

              DOWNLOAD_URL="${CPI_TMN_HOST}/api/v1/IntegrationDesigntimeArtifacts(Id='$ARTIFACT_ID',Version='active')/\$value"

              HTTP_STATUS=$(curl -s \
                -o "$ZIP_FILE" \
                -w "%{http_code}" \
                -X GET "$DOWNLOAD_URL" \
                -H "Authorization: Bearer $ACCESS_TOKEN" \
                -H "Cache-Control: no-cache")

              if [ "$HTTP_STATUS" -ne 200 ]; then
                echo "❌ Failed to download $ARTIFACT_ID"
                rm -rf "$ARTIFACT_GIT_DIR"
                continue
              fi

              if [ -f "$ZIP_FILE" ] && [ -s "$ZIP_FILE" ]; then

                unzip -q -o "$ZIP_FILE" -d "$ARTIFACT_GIT_DIR"

                echo "✅ Synced $ARTIFACT_ID"

              else

                echo "❌ Invalid ZIP for $ARTIFACT_ID"

                rm -rf "$ARTIFACT_GIT_DIR"
              fi

            done
          fi

          rm -rf "$TMP_DIR"

      - name: Commit and Push Changes
        run: |

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git status

          git add -A "${PACKAGE_ID}/"

          if [[ -n $(git status --porcelain) ]]; then

            git commit -m "Auto-sync CPI Package: ${PACKAGE_ID} (Build ${GITHUB_RUN_NUMBER})"

            echo "📤 Pushing changes..."

            git push origin ${BRANCH_NAME}

          else

            echo "ℹ️ No changes detected"

          fi

